# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: NAS 选型笔记
subtitle: '成品 NAS · 私有云 · 家庭存储，只讲怎么选'
description: 'NAS 选型笔记 —— 成品 NAS 与私有云选购参考：先讲清楚哪些人不该买，再比价格、盘位、系统与售后。'
keywords: NAS,NAS选购,成品NAS,私有云,家庭存储,网络存储,群晖,威联通,绿联,极空间,NAS选型笔记
author: Joey
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://rhua.net
root: /
permalink: :year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 访问统计
# Cloudflare Web Analytics 令牌配置在 _config.butterfly.yml 的 cloudflare_analytics
# （Butterfly 主题原生支持，自动注入 beacon 脚本；留空则完全不加载任何第三方请求）

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# 文章末尾引导组件（由 scripts/post-cta.js 注入，仅作用于文章，不含 about / disclaimer 等页面）
# 改这里就能改文案与按钮，不用改代码；enable: false 则整站不渲染
post_cta:
  enable: true
  title: 还有拿不准的地方？
  desc: 微信扫码关注公众号，或直接搜一搜「Rhua NAS」—— 盘位、网口、预算，说说你的情况，我帮你排。
  qr: /img/qr-wechat.jpg # 公众号「Rhua NAS」关注码，裁自微信搜一搜官方物料（400x400，46KB）
  qr_alt: 微信扫码关注公众号 Rhua NAS
  button_text: '' # 公众号没有落地链接，按钮留空即不渲染；兜底邮箱见侧栏与 /about/
  button_url: ''

# 首页的分享缩略图。主题在首页没有 cover 时会把 og:image 退回头像图标，
# 分享到微信很难看 —— 这里指定一张现成的封面顶上（只作用于首页，不影响文章各自封面）
index_og_image: /img/cover/cover-price-tiers.jpg

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# Sitemap / Feed
sitemap:
  path: sitemap.xml
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
