# 好物清单数据源
# ---------------------------------------------------------------------------
# 页面上的商品卡全部由本文件生成（scripts/goods-card.js 里的 {% goodslist %} 标签）。
# 改价格、换商品、上下架，只改这里，不用动页面。
#
# url        ：⚠️ 当前**不使用**（本站不挂联盟外链，原因见下），仅作内部记录
#              ⚠️ 京东联盟的「网站推广」渠道要求站点 ICP 备案，本站托管在 Cloudflare（境外、无备案），
#                 挂外链属平台风控点、佣金可能不结算。成交走社交渠道投放的推广链接（导购媒体推广，无需备案）。
#              若日后站点完成备案并改走网站推广，把这里填成真实联盟链接即可，卡片会自动恢复挂链。
# price      ：当前售价，页面上会展示
# price_from ：划线原价，可留空
# short      ：京东搜索关键词（卡片底部「在京东搜索「XX」即可找到」用它，不填则用商品全名）
# updated    ：价格核对日期（YYYY-MM-DD），页面会显示「价格核对于 X」
#              ⚠️ 联盟价格变动频繁，务必定期重核，过期价格会被投诉
# commission ：佣金率，仅内部记录，页面不展示
# note       ：一句话真实评价（建议写缺点，符合本站「先讲缺点」原则）
# groups     ：一个分组 = 页面上的一个板块，可自由增删
# ---------------------------------------------------------------------------

